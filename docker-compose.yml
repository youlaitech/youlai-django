services:
  mysql:
    image: mysql:8.0.29
    container_name: youlai-django-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=youlai_admin_django
    ports:
      - "3306:3306"
    volumes:
      - youlai_django_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    container_name: youlai-django-postgres
    restart: unless-stopped
    # 可选：仅在 DB_ENGINE=postgresql 时需要
    #   docker compose --profile postgres up -d
    profiles: ["postgres"]
    environment:
      - TZ=Asia/Shanghai
      - POSTGRES_USER=youlai
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=youlai_admin_django
    ports:
      - "5432:5432"
    volumes:
      - youlai_django_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youlai -d youlai_admin_django"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2.3
    container_name: youlai-django-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "123456", "--appendonly", "no"]
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # RustFS：S3 协议兼容的对象存储服务
  rustfs:
    image: rustfs/rustfs:latest
    container_name: youlai-django-rustfs
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - RUSTFS_ACCESS_KEY=rustfs-admin
      - RUSTFS_SECRET_KEY=rustfs-admin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - youlai_django_rustfs_data:/data

  web:
    build: .
    container_name: youlai-django-web
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      - OSS_TYPE=s3
      - S3_ENDPOINT=http://rustfs:9000
      - S3_ACCESS_KEY=rustfs-admin
      - S3_SECRET_KEY=rustfs-admin
      - S3_BUCKET_NAME=public
      - S3_SSL=false
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  youlai_django_mysql_data:
  youlai_django_postgres_data:
  youlai_django_rustfs_data:
